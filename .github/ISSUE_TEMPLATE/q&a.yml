name: Q&A
description: "问题解答"
title: "[Q&A] "
labels: []
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: 前置确认
      description: 在提交之前，请勾选以下选项以确认您已完成必要的自助排查
      options:
        - label: 我已查阅 [常见问题](https://github.com/nelvko/clash-for-linux-install/wiki/FAQ)，未找到解决方案
          required: true
        - label: 我已排查 [Issues](https://github.com/nelvko/clash-for-linux-install/issues)，未发现相关或重复的议题
          required: true

  - type: dropdown
    id: branch
    attributes:
      label: 克隆的分支
      options:
        - master
        - feat-init
        - arch-*
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell 环境
      options:
        - Bash
        - Zsh
        - Fish
        - Others
      default: 0
    validations:
      required: true

  - type: textarea
    id: desc
    attributes:
      label: 描述
      description: |
        ~~必要时~~最好附上截图
        （请勿泄露订阅等敏感信息）

    validations:
      required: true
  